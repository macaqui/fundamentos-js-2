<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galeria que consume una API con fetch. Ejercicio de fundamentos de JavaScript con React y Express.">
    <title>Mi mejor deseo</title>
    <!-- React y Babel incluidos en el proyecto: funcionan sin internet -->
    <script src="../vendor/react.development.js"></script>
    <script src="../vendor/react-dom.development.js"></script>
    <!-- (Babel local) -->
    <script src="../vendor/babel.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <noscript>Esta pagina necesita JavaScript activado para funcionar.</noscript>

    <div id="root"></div>

    <script type="text/babel">
        //  Esto es un hook  //
        const { useState, useEffect } = React;

        // En local y en Render la API esta en el mismo servidor; en GitHub Pages uso la de Render.
        const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname.indexOf("onrender.com") !== -1) ? "" : "https://fundamentos-js-2.onrender.com";
        const API_URL = API + "/items";

        // Version 2: se agrega estado de carga, un mensaje de error visible para el
        // usuario (antes solo se imprimia en consola) y botones accesibles.
        const Info = () => {
            const [data, setData] = useState([1]);        // Datos que vienen del backend
            const [currentInfo, setCurrentInfo] = useState(1);
            const [cargando, setCargando] = useState(true);
            const [error, setError] = useState("");

            useEffect(() => {
                // Bandera para ignorar la respuesta si el componente ya se desmonto.
                let activo = true;

                fetch(API_URL)
                    .then((res) => {
                        if (!res.ok) {
                            throw new Error("El servidor respondio " + res.status);
                        }
                        return res.json();
                    })
                    .then((res) => {
                        if (!activo) return;
                        if (Array.isArray(res.data) && res.data.length > 0) {
                            setData(res.data);
                            setCurrentInfo(res.data[0]);
                        }
                    })
                    .catch(() => {
                        if (activo) {
                            setError("No se pudo conectar con la API. Se muestra la imagen por defecto.");
                        }
                    })
                    .finally(() => {
                        if (activo) setCargando(false);
                    });

                return () => {
                    activo = false;
                };
            }, []);

            return (
                <>
                    <h1>Mi mejor deseo</h1>

                    {cargando && <p className="estado">Cargando datos de la API...</p>}
                    {error && <p className="estado error" role="alert">{error}</p>}

                    <img src={`img/${currentInfo}.jpg`} alt={`Imagen ${currentInfo} de la galeria`} />

                    <div className="botones">
                        {data.map((item) => (
                            <button
                                key={item}
                                type="button"
                                aria-label={`Mostrar la imagen ${item}`}
                                aria-pressed={currentInfo === item}
                                className={currentInfo === item ? "activo" : ""}
                                onClick={() => setCurrentInfo(item)}
                            >
                                Push me {item}
                            </button>
                        ))}
                    </div>
                </>
            );
        };

        // Lista de deseos: lee, crea y borra con la API REST
        const Deseos = () => {
            const [deseos, setDeseos] = useState([]);
            const [nombre, setNombre] = useState("");
            const [imagen, setImagen] = useState("1");
            const [cargando, setCargando] = useState(true);
            const [error, setError] = useState("");

            const cargar = () => {
                fetch(API + "/api/deseos")
                    .then((res) => {
                        if (!res.ok) {
                            throw new Error("El servidor respondio " + res.status);
                        }
                        return res.json();
                    })
                    .then((res) => {
                        if (Array.isArray(res)) {
                            setDeseos(res);
                            setError("");
                        }
                    })
                    .catch(() => setError("No se pudieron cargar los deseos."))
                    .finally(() => setCargando(false));
            };

            useEffect(cargar, []);

            const crear = (e) => {
                e.preventDefault();
                fetch(API + "/api/deseos", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nombre: nombre, imagen: imagen })
                })
                    .then((res) => {
                        if (!res.ok) {
                            throw new Error("El servidor respondio " + res.status);
                        }
                        return res.json();
                    })
                    .then(() => {
                        setNombre("");
                        cargar();
                    })
                    .catch(() => setError("No se pudo crear el deseo."));
            };

            const borrar = (id) => {
                fetch(API + "/api/deseos/" + id, { method: "DELETE" })
                    .then((res) => {
                        if (!res.ok) {
                            throw new Error("El servidor respondio " + res.status);
                        }
                        return res.json();
                    })
                    .then(() => cargar())
                    .catch(() => setError("No se pudo borrar el deseo."));
            };

            return (
                <section className="deseos">
                    <h2>Mis deseos</h2>

                    {cargando && <p className="estado">Cargando deseos...</p>}
                    {error && <p className="estado error" role="alert">{error}</p>}

                    <form onSubmit={crear}>
                        <input
                            type="text"
                            placeholder="Nombre"
                            value={nombre}
                            onChange={(e) => setNombre(e.target.value)}
                            aria-label="Nombre del deseo"
                            required
                        />
                        <input
                            type="number"
                            min="1"
                            placeholder="Imagen"
                            value={imagen}
                            onChange={(e) => setImagen(e.target.value)}
                            aria-label="Numero de imagen"
                            required
                        />
                        <button type="submit">Agregar</button>
                    </form>

                    <ul>
                        {deseos.map((d) => (
                            <li key={d.id}>
                                <span>{d.nombre}</span>
                                <img className="mini" src={`img/${d.imagen}.jpg`} alt={`Imagen ${d.imagen}`} />
                                <button type="button" onClick={() => borrar(d.id)}>Borrar</button>
                            </li>
                        ))}
                    </ul>
                </section>
            );
        };

        // Renderizar la aplicacion en el DOM virtual
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(
            <>
                <Info />
                <Deseos />
            </>
        );
    </script>
</body>

</html>
